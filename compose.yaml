services:
  laravel.test:
    build:
      context: ./docker/8.3
      dockerfile: Dockerfile
      args:
        WWWGROUP: '${WWWGROUP:-1000}'
    image: cinetickets-sail-8.3/app
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:${APP_PORT:-8000}:80'
      - '127.0.0.1:${VITE_PORT:-5173}:5173'
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      LARAVEL_SAIL: 1
      # Laravel 10 otherwise drops Docker's DB variables in the HTTP worker.
      SUPERVISOR_PHP_COMMAND: '/usr/bin/php -d variables_order=EGPCS /var/www/html/artisan serve --host=0.0.0.0 --port=80 --no-reload'
      XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
      APP_URL: 'http://localhost:${APP_PORT:-8000}'
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: '${DOCKER_DB_DATABASE:-cinetickets}'
      DB_USERNAME: sail
      DB_PASSWORD: '${DOCKER_DB_PASSWORD:-sail}'
    volumes:
      - '.:/var/www/html'
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: '${DOCKER_DB_ROOT_PASSWORD:-root-local}'
      MYSQL_DATABASE: '${DOCKER_DB_DATABASE:-cinetickets}'
      MYSQL_USER: sail
      MYSQL_PASSWORD: '${DOCKER_DB_PASSWORD:-sail}'
    volumes:
      - 'sail-mysql:/var/lib/mysql'
      - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh:ro'
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" -D "$$MYSQL_DATABASE" -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
volumes:
  sail-mysql:
